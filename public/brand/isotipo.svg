<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SciVerse">
  <title>SciVerse</title>
  <defs>
    <linearGradient id="svTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EC6C0"/>
      <stop offset="1" stop-color="#177C77"/>
    </linearGradient>
  </defs>

  <!-- Teselado base: squircle de marca -->
  <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#svTile)"/>

  <!-- Órbita: la idea de "verso" / universo del conocimiento -->
  <ellipse cx="32" cy="32" rx="21" ry="9.5"
           fill="none" stroke="#FFFFFF" stroke-width="3.2"
           stroke-linecap="round" opacity="0.92"
           transform="rotate(-28 32 32)"/>

  <!-- Núcleo: el docente en el centro -->
  <circle cx="32" cy="32" r="7.5" fill="#FFFFFF"/>

  <!-- Acento coral sobre la órbita: el elemento humano/cálido -->
  <circle cx="47.5" cy="23.5" r="4" fill="#FB6542"/>
</svg>
